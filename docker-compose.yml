services:
  customer-churn-api:
    build: .
    container_name: customer-churn-container

    ports:
      - "5000:5000"

    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      API_KEY: "${API_KEY}"